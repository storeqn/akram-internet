<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة الطلبات | خدمات أكرم</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="./admin.css"><script type="module" src="./admin.js"></script></head><body><header class="wrap nav"><a href="../" class="brand"><img src="../assets/logo.svg" width="44" height="44" alt="">إدارة خدمات أكرم</a><a class="button secondary small" href="/cdn-cgi/access/logout">تسجيل الخروج</a></header><main class="wrap"><div class="section-head"><div><p class="eyebrow blue">متابعة التجهيز</p><h1>طلبات الاشتراك</h1></div><button id="refresh" class="button small">تحديث الطلبات</button></div><p id="admin-status" role="status" aria-live="polite">جارٍ التحقق من صلاحية الوصول…</p><section id="dashboard" hidden><div id="stats" class="stats"></div><div class="filters"><label>ابحث بالاسم أو الهاتف أو العنوان<input id="search" type="search" placeholder="ابحث عن طلب"></label><label>الحالة<select id="status-filter"><option value="">جميع الحالات</option></select></label><label>المنطقة<select id="area-filter"><option value="">جميع المناطق</option></select></label></div><p id="count"></p><div id="orders" class="orders"></div></section></main><dialog id="edit-dialog"><div class="dialog-top"><h2>تحديث الطلب</h2><button type="button" id="cancel-edit" aria-label="إغلاق">×</button></div><form id="edit-form"><input type="hidden" name="id"><label>حالة الطلب<select name="status"></select></label><label>ملاحظات داخلية<textarea name="internalNotes" maxlength="2000" rows="4"></textarea></label><p id="edit-status" role="status"></p><button class="button full-width" type="submit">حفظ التغييرات</button></form></dialog></body></html>
